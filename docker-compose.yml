services:
  # ============ 存储层 ============
  postgres:
    image: postgres:16-alpine
    container_name: comet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comet}
      POSTGRES_DB: ${POSTGRES_DB:-comet}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    build: ./docker/es
    image: comet-es-ik:8.17.0
    container_name: comet-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  neo4j:
    image: neo4j:5.26
    container_name: comet-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cometneo4j}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: comet-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # Local multilingual cross-encoder. The host port is 8082 because the
  # Ollama BGE-M3 embedding service already occupies 127.0.0.1:8081.
  bge-reranker:
    # TEI 1.9 requires CUDA 12.9. Pin 1.8 for the current NVIDIA 566.26
    # driver (CUDA 12.7) while retaining the same /rerank API.
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.8
    container_name: bge-reranker-v2-m3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - tei_reranker_data:/data
    command:
      - --model-id
      - BAAI/bge-reranker-v2-m3
      - --max-client-batch-size
      - "32"
      - --tokenization-workers
      - "4"
      - --max-concurrent-requests
      - "32"
      - --max-batch-tokens
      - "16384"
      - --auto-truncate
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============ 应用层 ============
  api:
    build: ./api
    container_name: comet-api
    env_file:
      - .env
      # Keep application secrets aligned with host-side API tooling. Values in
      # this later file override duplicate root entries; service addresses below
      # remain explicitly pinned to Docker DNS names.
      - ./api/.env
    environment:
      POSTGRES_HOST: postgres
      ES_HOST: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CONNECTOR_LOCAL_ROOTS: /connector-data
      # MinerU runs in its own compose project and publishes the adapter on the
      # Windows host. Keep the full /parse endpoint explicit so PDF ingestion
      # cannot silently look "MinerU-enabled" while using PyMuPDF instead.
      MINERU_ENDPOINT: ${MINERU_ENDPOINT:-http://host.docker.internal:18080/parse}
      MINERU_TIMEOUT_SECONDS: ${MINERU_TIMEOUT_SECONDS:-1800}
    ports:
      - "8000:8000"
    volumes:
      - ./api/storage:/app/storage
      - ${CONNECTOR_LOCAL_PATH:-./connector-data}:/connector-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./api
    container_name: comet-worker
    # Async task entrypoints use asyncio.run() and process-global HTTP/ES/Redis
    # clients. Process isolation prevents concurrent event loops from closing or
    # reusing another task's client; the threads pool is unsafe for this design.
    command: celery -A app.celery_app.celery_app worker -l info -Q default,parse,memory,beat,research,knowledge --pool=prefork --concurrency=1
    env_file:
      - .env
      - ./api/.env
    environment:
      POSTGRES_HOST: postgres
      ES_HOST: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CONNECTOR_LOCAL_ROOTS: /connector-data
      MINERU_ENDPOINT: ${MINERU_ENDPOINT:-http://host.docker.internal:18080/parse}
      MINERU_TIMEOUT_SECONDS: ${MINERU_TIMEOUT_SECONDS:-1800}
      # Keep each local BGE-M3 request below the 60-second client timeout. Four
      # small in-flight batches preserve throughput without creating a backlog
      # of abandoned 80-item requests after timeouts.
      EMBED_BATCH_SIZE: "10"
      EMBED_CONCURRENCY: "4"
    volumes:
      - ./api/storage:/app/storage
      - ${CONNECTOR_LOCAL_PATH:-./connector-data}:/connector-data:ro
    depends_on:
      - redis
      - api

  beat:
    build: ./api
    container_name: comet-beat
    command: celery -A app.celery_app.celery_app beat -l info
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis

  web:
    build: ./web
    container_name: comet-web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pg_data:
  es_data:
  neo4j_data:
  redis_data:
  tei_reranker_data:
